version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: estimation-redis
    restart: unless-stopped
    # We do NOT expose ports to the host machine (no ports: - "6379:6379")
    # It will only be accessible internally via the 'redis' hostname on port 6379
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: estimation-web
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./:/app
    ports:
      - "2005:8001"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    container_name: estimation-worker
    command: celery -A celery_app worker --loglevel=info
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
