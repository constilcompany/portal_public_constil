version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: constil-staging-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - staging_redis_data:/data

  web:
    build: .
    container_name: constil-staging-web
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./:/app
    ports:
      - "8001:8001"
    env_file:
      - .env.staging
    environment:
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=staging
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    container_name: constil-staging-worker
    command: celery -A celery_app worker --loglevel=info -c 2 -Q celery
    volumes:
      - ./:/app
    env_file:
      - .env.staging
    environment:
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=staging
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  staging_redis_data:
